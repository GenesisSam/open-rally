[package]
name = "open-rally"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = { version = "3.7.0", optional = true }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
dirs = "7.0.0"
futures = "0.3.34"
if-addrs = "0.15.0"
mime_guess = "2.0.5"
muda = { version = "0.21.2", optional = true }
open = { version = "5.4.5", optional = true }
rand = "0.10.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tao = { version = "0.37.2", optional = true }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.2.0"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tray-icon = { version = "0.26.1", optional = true }
ulid = "3.0.0"

[features]
default = ["tray"]
# 메뉴바 앱. 끄면 (--no-default-features) 서버만 들어간 headless 바이너리 — Docker/Linux 서버용.
tray = ["dep:tray-icon", "dep:muda", "dep:tao", "dep:arboard", "dep:open"]

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
strip = true
lto = "thin"

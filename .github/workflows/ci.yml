name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (headless, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-default-features --locked

  macos:
    name: full (macOS, tray)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t open-rally .
      - name: smoke test
        run: |
          docker run -d --name rally -e OPEN_RALLY_PASSWORD=ci -p 127.0.0.1:7777:7777 open-rally
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:7777/ && break; sleep 0.5; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d '{"password":"ci"}' http://127.0.0.1:7777/api/login)
          test "$code" = "204"
          docker rm -f rally
